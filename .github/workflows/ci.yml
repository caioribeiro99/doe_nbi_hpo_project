name: ci

on:
  push:
    branches: [main, repo-publication-readiness]
  pull_request:
    branches: [main, repo-publication-readiness]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Configure libomp path on macOS
        if: runner.os == 'macOS'
        run: |
          LIBOMP_PREFIX="$(brew --prefix libomp)"
          echo "DYLD_LIBRARY_PATH=${LIBOMP_PREFIX}/lib:${DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${LIBOMP_PREFIX}/lib ${LDFLAGS}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I${LIBOMP_PREFIX}/include ${CPPFLAGS}" >> "$GITHUB_ENV"

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run unit tests
        run: pytest tests/unit -q

      - name: Run methodology tests
        run: pytest tests/methodology -q

      - name: Run integration smoke tests
        run: pytest tests/integration -q

      - name: CLI smoke
        run: |
          python -m doe_xgb.cli info
          python -m doe_xgb.cli validate --config configs/article_3vrf_xgb_magic.yaml
          python -m doe_xgb.cli smoke
